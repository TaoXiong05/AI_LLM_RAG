name: Deploy RAG

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/taoxiong05/ai-llm-rag:latest
            ghcr.io/taoxiong05/ai-llm-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare VM deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /home/deploy/ai-llm-rag

      - name: Copy Compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml
          target: /home/deploy/ai-llm-rag
          strip_components: 1

      - name: Write environment and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            umask 077
            mkdir -p /home/deploy/ai-llm-rag
            cat > /home/deploy/ai-llm-rag/.env <<'EOF'
            PG_DATABASE=${{ vars.PG_DATABASE }}
            PG_USER=${{ vars.PG_USER }}
            PG_PASSWORD=${{ secrets.PG_PASSWORD }}
            OPENAI_BASE_URL=${{ vars.OPENAI_BASE_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CHAT_MODEL=${{ vars.CHAT_MODEL }}
            OCR_MODEL=${{ vars.OCR_MODEL }}
            EMBED_MODEL=${{ vars.EMBED_MODEL }}
            COLLECTION_NAME=${{ vars.COLLECTION_NAME }}
            TOP_K=${{ vars.TOP_K }}
            CLEAR_KB_PASSWORD=${{ secrets.CLEAR_KB_PASSWORD }}
            EOF
            cd /home/deploy/ai-llm-rag
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f

      - name: Push edge routing fragment
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/rag.caddy"
          target: "/opt/edge-proxy/sites-enabled"
          strip_components: 1

      - name: Commit fragment and reload edge proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/edge-proxy
            if ! docker exec edge-proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              git checkout -- sites-enabled/rag.caddy 2>/dev/null || rm -f sites-enabled/rag.caddy
              echo "rag fragment failed validation; reverted, edge proxy untouched" >&2
              exit 1
            fi
            git add sites-enabled/rag.caddy
            git diff --cached --quiet || git commit -m "rag: update edge fragment"
            docker exec edge-proxy caddy reload --config /etc/caddy/Caddyfile
